<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kolam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Mukta+Malar:wght@200;300;400;500;600;700;800&family=Oi&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Hero ───────────────────────────────────── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1;
    }
    .hero-content {
      position: absolute;
      bottom: 3rem;
      left: 3rem;
      z-index: 2;
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 480px;
    }
    .hero h1 {
      font-family: 'Mukta Malar', sans-serif;
      font-size: clamp(2rem, 4vw, 3.25rem);
      font-weight: 300;
      line-height: 1.2;
      letter-spacing: 0.02em;
      margin-bottom: 0.25rem;
      color: #fff;
    }
    .hero p {
      font-size: clamp(0.8125rem, 1.1vw, 0.9375rem);
      color: rgba(255,255,255,0.7);
      max-width: 380px;
      line-height: 1.4;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      margin-bottom: 0;
    }
    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9375rem;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .hero-cta:hover { color: #fff; border-color: rgba(255,255,255,0.5); }

    /* ── Credit ─────────────────────────────────── */
    .credit {
      padding: 5rem 10vw;
      font-size: 0.8125rem;
      color: rgba(255,255,255,0.3);
      line-height: 1.7;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .credit a {
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.18);
    }
    .credit a:hover { color: rgba(255,255,255,0.8); border-color: rgba(255,255,255,0.4); }

    /* ── Mute toggle ────────────────────────────── */
    .mute-btn {
      position: absolute;
      bottom: 1.5rem;
      right: 1.75rem;
      z-index: 3;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 2.75rem;
      height: 2.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s, border-color 0.2s;
    }
    .mute-btn:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.4); }
    .mute-btn svg { width: 1.1rem; height: 1.1rem; fill: #fff; }

    /* ── Responsive ─────────────────────────────── */
    @media (max-width: 760px) {
      .hero-content { bottom: 1.5rem; left: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- ── Hero ───────────────────────────────────── -->
  <section class="hero">
    <video class="hero-video" autoplay muted playsinline>
      <source src="hero.mp4" type="video/mp4" />
    </video>
    <div class="hero-overlay"></div>
    <button class="mute-btn" id="muteBtn" aria-label="Unmute video">
      <!-- unmute icon (speaker with X) — shown when muted -->
      <svg id="icon-muted" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>
      </svg>
      <!-- sound icon — shown when unmuted -->
      <svg id="icon-sound" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
    </button>
    <div class="hero-content">
      <h1>கோலம்</h1>
      <p>kolam</p>
      
      <!-- <a class="hero-cta" href="#step-1">Make your own ↓</a> -->
    </div>
  </section>
 
  <script>
    /* ── Mute toggle ────────────────────────────── */
    (function () {
      const video   = document.querySelector('.hero-video');
      const btn     = document.getElementById('muteBtn');
      const iconMuted = document.getElementById('icon-muted');
      const iconSound = document.getElementById('icon-sound');

      function setMuted(muted) {
        video.muted = muted;
        iconMuted.style.display = muted ? '' : 'none';
        iconSound.style.display = muted ? 'none' : '';
        btn.setAttribute('aria-label', muted ? 'Unmute video' : 'Mute video');
      }

      btn.addEventListener('click', () => setMuted(!video.muted));

      // Chrome pauses off-screen videos — force resume unless user explicitly paused
      let userPaused = false;
      video.addEventListener('pause', () => { if (!userPaused) video.play().catch(() => {}); });
    })();
  </script>
</body>
</html>
